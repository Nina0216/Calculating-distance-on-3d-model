<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟星球——距离测算仪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #050810;
  --bg-panel: rgba(8, 16, 32, 0.72);
  --bg-panel-solid: #0a1428;
  --cyan: #00f0ff;
  --cyan-dim: #00a8b8;
  --purple: #7b2ff7;
  --orange: #ff6b35;
  --green: #39ff14;
  --text: #d8f4ff;
  --text-dim: #6b8aa8;
  --border: rgba(0, 240, 255, 0.25);
  --border-strong: rgba(0, 240, 255, 0.6);
  --glow-cyan: 0 0 12px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.15);
  --glow-orange: 0 0 12px rgba(255, 107, 53, 0.6), 0 0 30px rgba(255, 107, 53, 0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg-deep);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(0, 240, 255, 0.06), transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(123, 47, 247, 0.08), transparent 50%);
  pointer-events: none; z-index: 0;
}

.scanlines {
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 240, 255, 0.015) 0px,
    rgba(0, 240, 255, 0.015) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none; z-index: 9999;
}

#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  width: 100%; height: 100%;
}

/* ===== Header ===== */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(0,240,255,0.04), transparent);
  backdrop-filter: blur(8px);
  position: relative;
}
.header::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.5;
}
.title-group { display: flex; align-items: baseline; gap: 14px; }
.title {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px; font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(0,240,255,0.3);
}
.subtitle {
  font-size: 13px; color: var(--text-dim);
  letter-spacing: 4px; text-transform: uppercase;
}
.hud-status {
  display: flex; gap: 18px; align-items: center;
  font-size: 12px; font-family: 'Orbitron', monospace;
  color: var(--cyan-dim); letter-spacing: 1px;
}
.hud-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 1.5s ease-in-out infinite;
  display: inline-block; margin-right: 6px;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ===== Main Layout ===== */
.main {
  flex: 1; display: flex; min-height: 0;
}

/* ===== 3D Canvas ===== */
.stage {
  flex: 1; position: relative; min-width: 0;
}
#canvas-container {
  width: 100%; height: 100%;
}
.stage-hint {
  position: absolute; top: 16px; left: 16px;
  font-size: 11px; color: var(--text-dim);
  font-family: 'Orbitron', monospace; letter-spacing: 1px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 4px;
  backdrop-filter: blur(6px);
}
.stage-hint span { color: var(--cyan); }
.planet-label {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-family: 'Orbitron', sans-serif;
  font-size: 14px; letter-spacing: 6px;
  color: var(--cyan); text-shadow: var(--glow-cyan);
  text-transform: uppercase;
}
.scale-bar {
  position: absolute; bottom: 22px; left: 22px;
  display: flex; flex-direction: column; align-items: flex-start;
  gap: 5px; pointer-events: none;
}
.scale-track {
  height: 5px;
  background: var(--cyan);
  border: 1px solid var(--cyan-dim);
  box-shadow: var(--glow-cyan);
  opacity: 0.9;
  position: relative;
}
.scale-track::before, .scale-track::after {
  content: '';
  position: absolute; top: -4px; bottom: -4px; width: 2px;
  background: var(--cyan);
}
.scale-track::before { left: 0; }
.scale-track::after { right: 0; }
.scale-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px; letter-spacing: 1px;
  color: var(--cyan); text-shadow: 0 0 6px rgba(0,240,255,0.6);
}

/* ===== Sidebar ===== */
.sidebar {
  width: 320px; flex-shrink: 0;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  backdrop-filter: blur(12px);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }
.panel-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; letter-spacing: 3px;
  color: var(--cyan); text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.panel-title::before {
  content: ''; width: 4px; height: 12px;
  background: var(--cyan); box-shadow: var(--glow-cyan);
}

/* Planet list */
.planet-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 168px; overflow-y: auto;
}
.planet-list::-webkit-scrollbar { width: 4px; }
.planet-list::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }
.planet-card {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer; transition: all 0.2s;
  background: rgba(0, 240, 255, 0.03);
}
.planet-card:hover {
  background: rgba(0, 240, 255, 0.1);
  border-color: var(--border);
}
.planet-card.active {
  background: rgba(0, 240, 255, 0.12);
  border-color: var(--border-strong);
  box-shadow: var(--glow-cyan);
}
.planet-dot {
  width: 22px; height: 22px; border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 10px currentColor;
}
.planet-info { flex: 1; min-width: 0; }
.planet-name { font-size: 13px; font-weight: 600; color: var(--text); }
.planet-radius { font-size: 10px; color: var(--text-dim); font-family: 'Orbitron', monospace; }
.planet-delete {
  background: transparent; border: none; color: var(--text-dim);
  font-size: 16px; cursor: pointer; padding: 0 4px;
  opacity: 0; transition: all 0.2s; line-height: 1;
}
.planet-card:hover .planet-delete { opacity: 1; }
.planet-delete:hover { color: var(--orange); transform: scale(1.2); }

/* Custom planet */
.custom-toggle {
  width: 100%; padding: 8px;
  background: rgba(123, 47, 247, 0.1);
  border: 1px dashed var(--purple);
  border-radius: 6px; color: var(--purple);
  font-family: 'Orbitron', sans-serif; font-size: 11px;
  letter-spacing: 1px; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
}
.custom-toggle:hover { background: rgba(123, 47, 247, 0.2); }
.custom-form {
  margin-top: 10px; display: none;
  flex-direction: column; gap: 8px;
}
.custom-form.show { display: flex; }
.custom-form input {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px;
  border-radius: 4px; font-size: 12px;
  font-family: 'Rajdhani', sans-serif;
  outline: none; transition: border 0.2s;
}
.custom-form input:focus { border-color: var(--purple); }
.custom-form label {
  font-size: 10px; color: var(--text-dim);
  font-family: 'Orbitron', monospace; letter-spacing: 1px;
}
.custom-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.custom-row > div { display: flex; flex-direction: column; gap: 2px; }
.custom-form input[type="color"] {
  height: 32px; padding: 2px; cursor: pointer;
}
.custom-form select {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px;
  border-radius: 4px; font-size: 12px;
  font-family: 'Rajdhani', sans-serif;
  outline: none;
}
.custom-form select:focus { border-color: var(--purple); }

/* ===== Input Panel ===== */
.input-panel {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.point-block {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px;
  margin-bottom: 8px;
}
.point-block.point-a { border-left: 3px solid var(--cyan); }
.point-block.point-b { border-left: 3px solid var(--orange); }
.point-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.point-label {
  font-family: 'Orbitron', sans-serif; font-size: 11px;
  letter-spacing: 2px; font-weight: 700;
}
.point-a .point-label { color: var(--cyan); }
.point-b .point-label { color: var(--orange); }
.coord-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.coord-input {
  display: flex; flex-direction: column; gap: 2px;
}
.coord-input label {
  font-size: 9px; color: var(--text-dim);
  font-family: 'Orbitron', monospace; letter-spacing: 1px;
}
.coord-input input {
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--border);
  color: var(--text); padding: 5px 6px;
  border-radius: 3px; font-size: 13px;
  font-family: 'Orbitron', monospace;
  outline: none; transition: all 0.2s;
  width: 100%; box-sizing: border-box;
  -moz-appearance: textfield;
}
.coord-input input::-webkit-outer-spin-button,
.coord-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.coord-input input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 8px rgba(0,240,255,0.3);
}
.mode-switch {
  display: flex; gap: 6px; margin-bottom: 10px;
}
.mode-btn {
  flex: 1; padding: 6px; font-size: 11px;
  font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 4px;
  cursor: pointer; transition: all 0.2s;
  text-transform: uppercase;
}
.mode-btn.active {
  background: rgba(0,240,255,0.15);
  border-color: var(--cyan);
  color: var(--cyan);
}

/* ===== Result ===== */
.result-section {
  padding: 10px 12px;
  background: linear-gradient(180deg, rgba(0,240,255,0.04), transparent);
}
.calc-btn {
  width: 100%; padding: 8px;
  background: linear-gradient(135deg, var(--cyan-dim), var(--purple));
  border: none; border-radius: 6px;
  color: #fff; font-family: 'Orbitron', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s;
  text-transform: uppercase;
  box-shadow: 0 0 10px rgba(0,240,255,0.3);
}
.calc-btn:hover {
  box-shadow: 0 0 20px rgba(0,240,255,0.6);
  transform: translateY(-1px);
}
.calc-btn:active { transform: translateY(0); }
.distance-display {
  padding: 12px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border-strong);
  border-radius: 6px; text-align: center;
  min-height: 64px; display: flex;
  flex-direction: column; justify-content: center;
}
.distance-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px; font-weight: 900;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
  line-height: 1.2;
}
.distance-unit {
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 2px; margin-top: 2px;
}
.distance-compare {
  font-size: 10px; color: var(--orange);
  margin-top: 6px; min-height: 12px;
}
.planet-stats {
  margin-top: 10px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.stat-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 0;
  font-size: 11px;
}
.stat-row span:first-child {
  color: var(--text-dim);
  font-family: 'Orbitron', monospace;
  letter-spacing: 1px;
}
.stat-row span:last-child {
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
}

/* corner brackets */
.corners { position: relative; }
.corners::before, .corners::after {
  content: ''; position: absolute; width: 10px; height: 10px;
  border-color: var(--cyan); border-style: solid;
}
.corners::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.corners::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

@media (max-width: 900px) {
  .main { flex-direction: column; }
  .sidebar { width: 100%; max-height: 50vh; border-left: none; border-top: 1px solid var(--border); }
  .title { font-size: 16px; }
  .subtitle { display: none; }
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div id="app">
  <header class="header">
    <div class="title-group">
      <h1 class="title">模拟星球——距离测算仪</h1>
      <span class="subtitle">Planetary Distance Calculator</span>
    </div>
    <div class="hud-status">
      <span><span class="hud-dot"></span>SYSTEM ONLINE</span>
      <span id="hud-planet">EARTH</span>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <div id="canvas-container"></div>
      <div class="stage-hint">拖拽旋转 · 滚轮缩放 · <span>点击球体选点</span></div>
      <div class="planet-label" id="planet-label">EARTH</div>
      <div class="scale-bar" id="scale-bar">
        <div class="scale-track" id="scale-track"></div>
        <div class="scale-label" id="scale-label">-- km</div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="panel-section">
        <div class="panel-title">选择星球</div>
        <div class="planet-list" id="planet-list"></div>
        <button class="custom-toggle" id="custom-toggle">+ 自定义星球</button>
        <div class="custom-form" id="custom-form">
          <div>
            <label>星球名称</label>
            <input type="text" id="custom-name" placeholder="例如：氪星">
          </div>
          <div class="custom-row">
            <div>
              <label>赤道半径 (km)</label>
              <input type="number" id="custom-eq" placeholder="6378.137" step="0.001">
            </div>
            <div>
              <label>极半径 (km)</label>
              <input type="number" id="custom-polar" placeholder="6356.752" step="0.001">
            </div>
          </div>
          <div class="custom-row">
            <div>
              <label>星球颜色</label>
              <input type="color" id="custom-color" value="#7b2ff7">
            </div>
            <div>
              <label>星球类型</label>
              <select id="custom-type">
                <option value="rocky">岩石行星</option>
                <option value="gas">气态行星</option>
              </select>
            </div>
          </div>
          <button class="calc-btn" id="create-custom" style="padding:8px;font-size:11px;">创建星球</button>
        </div>
      </div>

      <div class="input-panel">
        <div class="panel-title">坐标输入 · 可直接点击球体选点</div>
        <div class="point-block point-a corners">
          <div class="point-header">
            <span class="point-label">POINT A</span>
            <span style="font-size:10px;color:var(--text-dim);font-family:'Orbitron',monospace;" id="latlon-a">--</span>
          </div>
          <div class="coord-row">
            <div class="coord-input">
              <label>纬度 LAT</label>
              <input type="number" id="lat-a" placeholder="39.9042" step="0.0001">
            </div>
            <div class="coord-input">
              <label>经度 LON</label>
              <input type="number" id="lon-a" placeholder="116.4074" step="0.0001">
            </div>
          </div>
        </div>
        <div class="point-block point-b corners">
          <div class="point-header">
            <span class="point-label">POINT B</span>
            <span style="font-size:10px;color:var(--text-dim);font-family:'Orbitron',monospace;" id="latlon-b">--</span>
          </div>
          <div class="coord-row">
            <div class="coord-input">
              <label>纬度 LAT</label>
              <input type="number" id="lat-b" placeholder="31.2304" step="0.0001">
            </div>
            <div class="coord-input">
              <label>经度 LON</label>
              <input type="number" id="lon-b" placeholder="121.4737" step="0.0001">
            </div>
          </div>
        </div>
      </div>

      <div class="result-section">
        <div class="distance-display corners">
          <div class="distance-value" id="distance-value">--</div>
          <div class="distance-unit">KILOMETERS</div>
          <div class="distance-compare" id="distance-compare"></div>
        </div>
        <div class="planet-stats" id="planet-stats">
          <div class="panel-title" style="margin-bottom:8px;">星球统计</div>
          <div class="stat-row"><span>赤道半径</span><span id="stat-eq">-- km</span></div>
          <div class="stat-row"><span>极半径</span><span id="stat-polar">-- km</span></div>
          <div class="stat-row"><span>赤道周长</span><span id="stat-circum-eq">-- km</span></div>
          <div class="stat-row"><span>极周长</span><span id="stat-circum-polar">-- km</span></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== Planet Data =====
// Textures sourced from solarsystemscope.com (NASA elevation & imagery,
// true-color tuned) and bundled locally under ./textures/ so there are no
// CORS / hotlink issues.
const TEX = 'textures/';
let PLANETS = [
  { id: 'earth', name: '地球', en: 'Earth', eq: 6378.137, polar: 6356.752, color: 0x2a6df4, type: 'rocky', texture: TEX + '2k_earth_daymap.jpg', clouds: TEX + '2k_earth_clouds.jpg' },
  { id: 'mars', name: '火星', en: 'Mars', eq: 3396.19, polar: 3376.2, color: 0xc1440e, type: 'rocky', texture: TEX + '2k_mars.jpg' },
  { id: 'jupiter', name: '木星', en: 'Jupiter', eq: 71492, polar: 66854, color: 0xd8ca9d, type: 'gas', texture: TEX + '2k_jupiter.jpg' },
  { id: 'saturn', name: '土星', en: 'Saturn', eq: 60268, polar: 54364, color: 0xfad5a5, type: 'gas', texture: TEX + '2k_saturn.jpg' },
  { id: 'uranus', name: '天王星', en: 'Uranus', eq: 25559, polar: 24973, color: 0x4fd0e7, type: 'gas', texture: TEX + '2k_uranus.jpg' },
  { id: 'neptune', name: '海王星', en: 'Neptune', eq: 24764, polar: 24341, color: 0x4166f5, type: 'gas', texture: TEX + '2k_neptune.jpg' },
  { id: 'venus', name: '金星', en: 'Venus', eq: 6051.8, polar: 6051.8, color: 0xe8b97a, type: 'rocky', texture: TEX + '2k_venus_surface.jpg' },
  { id: 'mercury', name: '水星', en: 'Mercury', eq: 2439.7, polar: 2439.7, color: 0x9c9c9c, type: 'rocky', texture: TEX + '2k_mercury.jpg' },
  { id: 'moon', name: '月球', en: 'Moon', eq: 1737.4, polar: 1737.4, color: 0xbdbdbd, type: 'rocky', texture: TEX + '2k_moon.jpg' },
];

let currentPlanet = PLANETS[0];
let nextPoint = 'A';

// ===== Three.js Setup =====
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.8;
controls.maxDistance = 12;

// Lights — brighter so planets stand out from the dark background
scene.add(new THREE.AmbientLight(0x6688aa, 1.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
rimLight.position.set(-5, -2, -3);
scene.add(rimLight);

// Starfield

let planetMesh = null;
let gridMesh = null;
let markerA = null;
let markerB = null;
let arcLine = null;
let arcDistanceLabel = null;

const BASE_RADIUS = 1; // visual radius

// Create a text sprite (always faces camera)
function makeTextSprite(text, color, fontSize, bgColor) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const w = 256, h = 128;
  canvas.width = w; canvas.height = h;
  ctx.font = `bold ${fontSize}px Orbitron, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (bgColor) {
    ctx.fillStyle = bgColor;
    roundRect(ctx, 4, 4, w - 8, h - 8, 16);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    roundRect(ctx, 4, 4, w - 8, h - 8, 16);
    ctx.stroke();
  }
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, h / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  return sprite;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Procedural texture generator for custom planets (or as fallback)
function makeProceduralTexture(colorHex, type) {
  const w = 1024, h = 512;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const base = new THREE.Color(colorHex);
  const baseStr = `rgb(${Math.round(base.r*255)},${Math.round(base.g*255)},${Math.round(base.b*255)})`;

  if (type === 'gas') {
    // ---- Gas giant: soft horizontal bands + storms, Jupiter-style ----
    // Fill base
    ctx.fillStyle = baseStr;
    ctx.fillRect(0, 0, w, h);

    // Build bands as vertical gradient strips with soft transitions
    const bands = 22;
    for (let i = 0; i < bands; i++) {
      const y1 = (i / bands) * h;
      const y2 = ((i + 1) / bands) * h;
      const shade = 0.55 + Math.random() * 0.9;
      const r = Math.max(0, Math.min(255, Math.round(base.r * 255 * shade)));
      const g = Math.max(0, Math.min(255, Math.round(base.g * 255 * shade)));
      const b = Math.max(0, Math.min(255, Math.round(base.b * 255 * shade)));
      const grd = ctx.createLinearGradient(0, y1, 0, y2);
      grd.addColorStop(0, `rgba(${r},${g},${b},0.85)`);
      grd.addColorStop(0.5, `rgba(${r},${g},${b},1)`);
      grd.addColorStop(1, `rgba(${r},${g},${b},0.85)`);
      ctx.fillStyle = grd;
      ctx.fillRect(0, y1, w, y2 - y1);
    }

    // Wavy distortion along band edges (turbulence)
    ctx.globalCompositeOperation = 'source-over';
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < bands; i++) {
        const y = (i / bands) * h;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 8) {
          const wave = Math.sin(x * 0.012 + i * 1.3 + pass) * (6 + Math.random() * 10)
                     + Math.sin(x * 0.03 + i * 2.1) * 3;
          ctx.lineTo(x, y + wave);
        }
        const shade = 0.7 + Math.random() * 0.6;
        ctx.strokeStyle = `rgba(${Math.round(base.r*255*shade)},${Math.round(base.g*255*shade)},${Math.round(base.b*255*shade)},0.25)`;
        ctx.lineWidth = 3 + Math.random() * 4;
        ctx.stroke();
      }
    }

    // Storm spots (oval, like Jupiter's Great Red Spot)
    const stormCount = 3 + Math.floor(Math.random() * 4);
    for (let s = 0; s < stormCount; s++) {
      const sx = Math.random() * w;
      const sy = h * 0.2 + Math.random() * h * 0.6;
      const rx = 40 + Math.random() * 80;
      const ry = 20 + Math.random() * 35;
      const stormShade = 0.4 + Math.random() * 0.4;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate((Math.random() - 0.5) * 0.3);
      const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      grd.addColorStop(0, `rgba(${Math.round(base.r*255*stormShade)},${Math.round(base.g*255*stormShade)},${Math.round(base.b*255*stormShade)},0.85)`);
      grd.addColorStop(0.6, `rgba(${Math.round(base.r*255*stormShade*1.2)},${Math.round(base.g*255*stormShade*1.2)},${Math.round(base.b*255*stormShade*1.2)},0.4)`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Subtle bright swirls
    ctx.globalAlpha = 0.12;
    for (let s = 0; s < 80; s++) {
      const sx = Math.random() * w;
      const sy = Math.random() * h;
      const sr = 15 + Math.random() * 50;
      const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      grd.addColorStop(0, 'rgba(255,255,255,0.6)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

  } else {
    // ---- Rocky planet: multi-octave noise terrain + craters ----
    ctx.fillStyle = baseStr;
    ctx.fillRect(0, 0, w, h);

    // Multi-scale noise for terrain-like variation
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    // precompute a small noise grid and interpolate (value noise)
    const noiseW = 64, noiseH = 32;
    const noiseGrid = [];
    for (let y = 0; y <= noiseH; y++) {
      noiseGrid[y] = [];
      for (let x = 0; x <= noiseW; x++) {
        noiseGrid[y][x] = Math.random();
      }
    }
    const smoothNoise = (nx, ny) => {
      const ix = Math.floor(nx), iy = Math.floor(ny);
      const fx = nx - ix, fy = ny - iy;
      const a = noiseGrid[iy % noiseH][ix % noiseW];
      const b = noiseGrid[iy % noiseH][(ix + 1) % noiseW];
      const c = noiseGrid[(iy + 1) % noiseH][ix % noiseW];
      const d = noiseGrid[(iy + 1) % noiseH][(ix + 1) % noiseW];
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
    };
    const fbm = (x, y) => {
      let v = 0, amp = 0.5, freq = 1;
      for (let o = 0; o < 4; o++) {
        v += smoothNoise(x * freq, y * freq) * amp;
        freq *= 2; amp *= 0.5;
      }
      return v;
    };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const n = fbm(x / 16, y / 16) - 0.5;
        const shade = 0.6 + n * 0.9;
        data[idx]   = Math.max(0, Math.min(255, data[idx]   * shade));
        data[idx+1] = Math.max(0, Math.min(255, data[idx+1] * shade));
        data[idx+2] = Math.max(0, Math.min(255, data[idx+2] * shade));
      }
    }
    ctx.putImageData(imgData, 0, 0);

    // Craters with rim highlight + shadow
    for (let c = 0; c < 160; c++) {
      const cx = Math.random() * w;
      const cy = Math.random() * h;
      const cr = 4 + Math.random() * 22;
      // shadow side
      const grd = ctx.createRadialGradient(cx + cr * 0.3, cy + cr * 0.3, 0, cx, cy, cr);
      grd.addColorStop(0, 'rgba(0,0,0,0.45)');
      grd.addColorStop(0.6, 'rgba(0,0,0,0.18)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fill();
      // rim highlight
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function vec3ToLatLon(vec, eq, polar) {
  const r = vec.length();
  const lat = 90 - (Math.acos(vec.y / r) * 180 / Math.PI);
  let lon = (Math.atan2(vec.z, -vec.x) * 180 / Math.PI) - 180;
  if (lon < -180) lon += 360;
  if (lon > 180) lon -= 360;
  return { lat, lon };
}

function buildPlanet(planet) {
  // clear old
  while (planetGroup.children.length) {
    const c = planetGroup.children[0];
    planetGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (c.material.map) c.material.map.dispose();
      c.material.dispose();
    }
  }
  planetMesh = null; gridMesh = null; markerA = null; markerB = null; arcLine = null; arcDistanceLabel = null;

  const yScale = planet.polar / planet.eq;

  const geo = new THREE.SphereGeometry(BASE_RADIUS, 64, 64);
  const isGas = (planet.type || 'rocky') === 'gas';
  const mat = new THREE.MeshStandardMaterial({
    color: planet.color,
    emissive: planet.color,
    emissiveIntensity: 0.06,
    roughness: isGas ? 0.85 : 0.95,
    metalness: 0.0,
    transparent: true,
    opacity: 0.92,
  });
  planetMesh = new THREE.Mesh(geo, mat);
  planetMesh.scale.y = yScale;
  planetGroup.add(planetMesh);

  // Load texture (real image or procedural fallback)
  const loader = new THREE.TextureLoader();
  const useTexture = (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace;
    mat.map = texture;
    mat.color.set(0xffffff);
    mat.emissive.set(planet.color);
    mat.emissiveIntensity = 0.04;
    mat.opacity = 1;
    mat.needsUpdate = true;
  };

  // Earth special: add a semi-transparent clouds layer for the globe look.
  // (Normal/specular maps from the old three.js CDN are gone, so we keep it
  //  simple: crisp day map + drifting clouds, which reads clearly as a globe.)
  const applyEarthExtras = () => {
    if (planet.id !== 'earth' || !planet.clouds) return;
    loader.load(planet.clouds, (cloudTex) => {
      cloudTex.colorSpace = THREE.SRGBColorSpace;
      const cloudMat = new THREE.MeshStandardMaterial({
        map: cloudTex, transparent: true, opacity: 0.5,
        depthWrite: false, roughness: 1.0,
      });
      const cloudMesh = new THREE.Mesh(geo, cloudMat);
      cloudMesh.scale.y = yScale;
      cloudMesh.scale.multiplyScalar(1.015);
      cloudMesh.renderOrder = 2;
      planetGroup.add(cloudMesh);
      planetMesh.userData.clouds = cloudMesh;
    });
  };

  if (planet.texture) {
    loader.load(planet.texture, (tex) => {
      useTexture(tex);
      applyEarthExtras();
    }, undefined, () => {
      // fallback: procedural
      const pt = makeProceduralTexture(planet.color, planet.type || 'rocky');
      useTexture(pt);
    });
  } else {
    // custom planet: procedural texture
    const pt = makeProceduralTexture(planet.color, planet.type || 'rocky');
    useTexture(pt);
  }

  // Grid (lat/lon lines)
  const gridMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.25 });
  const gridGroup = new THREE.Group();
  // longitude lines
  for (let lon = -180; lon < 180; lon += 30) {
    const pts = [];
    for (let lat = -90; lat <= 90; lat += 5) {
      pts.push(latLonToVec3(lat, lon, BASE_RADIUS * 1.001));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    gridGroup.add(new THREE.Line(g, gridMat));
  }
  // latitude lines
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = [];
    for (let lon = -180; lon <= 180; lon += 5) {
      pts.push(latLonToVec3(lat, lon, BASE_RADIUS * 1.001));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    gridGroup.add(new THREE.Line(g, gridMat));
  }
  gridGroup.scale.y = yScale;
  gridMesh = gridGroup;
  planetGroup.add(gridGroup);

  // Grid degree labels (sprites)
  const labelR = BASE_RADIUS * 1.07;
  const latLbls = [[60,'60°N'],[30,'30°N'],[0,'0°'],[-30,'30°S'],[-60,'60°S']];
  latLbls.forEach(([lat, txt]) => {
    const s = makeTextSprite(txt, '#00f0ff', 36, null);
    const p = latLonToVec3(lat, -90, labelR);
    p.y *= yScale;
    s.position.copy(p);
    s.scale.set(0.16, 0.08, 1);
    s.renderOrder = 50;
    gridGroup.add(s);
  });
  const lonLbls = [[-180,'180°'],[-120,'120°W'],[-60,'60°W'],[0,'0°'],[60,'60°E'],[120,'120°E']];
  lonLbls.forEach(([lon, txt]) => {
    const s = makeTextSprite(txt, '#00f0ff', 36, null);
    const p = latLonToVec3(0, lon, labelR);
    p.y *= yScale;
    s.position.copy(p);
    s.scale.set(0.16, 0.08, 1);
    s.renderOrder = 50;
    gridGroup.add(s);
  });

  // atmosphere glow
  const atmoGeo = new THREE.SphereGeometry(BASE_RADIUS * 1.08, 32, 32);
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: { c: { value: 0.5 }, p: { value: 4.0 }, glowColor: { value: new THREE.Color(planet.color) } },
    vertexShader: `varying vec3 vNormal; void main(){ vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 glowColor; uniform float c; uniform float p; varying vec3 vNormal; void main(){ float intensity = pow(c - dot(vNormal, vec3(0,0,1.0)), p); gl_FragColor = vec4(glowColor, 1.0) * intensity; }`,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true
  });
  const atmo = new THREE.Mesh(atmoGeo, atmoMat);
  atmo.scale.y = yScale;
  planetGroup.add(atmo);
}

function makeMarker(color, label) {
  const group = new THREE.Group();
  // visible dot
  const dotGeo = new THREE.SphereGeometry(0.035, 16, 16);
  const dotMat = new THREE.MeshBasicMaterial({ color });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  group.add(dot);
  // larger invisible hit area so the marker is easy to grab
  const hitGeo = new THREE.SphereGeometry(0.09, 8, 8);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hit = new THREE.Mesh(hitGeo, hitMat);
  group.add(hit);
  // glow ring
  const ringGeo = new THREE.RingGeometry(0.05, 0.07, 24);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.lookAt(camera.position);
  group.userData.ring = ring;
  group.add(ring);
  // text label (A / B) floating above the marker
  if (label) {
    const labelSprite = makeTextSprite(label, '#' + color.toString(16).padStart(6, '0'), 64, 'rgba(5,8,16,0.7)');
    labelSprite.scale.set(0.22, 0.11, 1);
    labelSprite.position.set(0, 0.11, 0);
    labelSprite.renderOrder = 999;
    group.userData.label = labelSprite;
    group.add(labelSprite);
  }
  return group;
}

function setMarker(point, lat, lon) {
  const yScale = currentPlanet.polar / currentPlanet.eq;
  const pos = latLonToVec3(lat, lon, BASE_RADIUS * 1.02);
  pos.y *= yScale;
  let marker = point === 'A' ? markerA : markerB;
  if (!marker) {
    marker = makeMarker(point === 'A' ? 0x00f0ff : 0xff6b35, point);
    if (point === 'A') markerA = marker; else markerB = marker;
    planetGroup.add(marker);
  }
  marker.position.copy(pos);
  marker.userData.lat = lat;
  marker.userData.lon = lon;
}

function drawArc(lat1, lon1, lat2, lon2) {
  if (arcLine) { planetGroup.remove(arcLine); arcLine.geometry.dispose(); arcLine = null; }
  if (arcDistanceLabel) { planetGroup.remove(arcDistanceLabel); arcDistanceLabel.material.map.dispose(); arcDistanceLabel.material.dispose(); arcDistanceLabel = null; }
  const yScale = currentPlanet.polar / currentPlanet.eq;
  const v1 = latLonToVec3(lat1, lon1, 1).normalize();
  const v2 = latLonToVec3(lat2, lon2, 1).normalize();
  const angle = v1.angleTo(v2);
  if (angle < 0.001) return;
  const axis = new THREE.Vector3().crossVectors(v1, v2).normalize();
  const steps = 64;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = angle * t;
    const v = v1.clone().applyAxisAngle(axis, a).multiplyScalar(BASE_RADIUS * 1.01);
    v.y *= yScale;
    pts.push(v);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0xff6b35, transparent: true, opacity: 0.9 });
  arcLine = new THREE.Line(geo, mat);
  planetGroup.add(arcLine);

  // distance label at arc midpoint
  const midT = 0.5;
  const midA = angle * midT;
  const midPos = v1.clone().applyAxisAngle(axis, midA).multiplyScalar(BASE_RADIUS * 1.18);
  midPos.y *= yScale;
  arcDistanceLabel = makeTextSprite('0 km', '#ff6b35', 40, null);
  arcDistanceLabel.scale.set(0.51, 0.17, 1);
  arcDistanceLabel.position.copy(midPos);
  arcDistanceLabel.renderOrder = 999;
  planetGroup.add(arcDistanceLabel);
}

function updateArcDistanceLabel(distance) {
  if (!arcDistanceLabel) return;
  const d = Math.round(distance);
  const txt = `${d.toLocaleString('en-US')} km`;
  const color = '#ff6b35';
  // No background box — just stroked text so it never occludes markers.
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const w = 384, h = 128;
  canvas.width = w; canvas.height = h;
  ctx.font = 'bold 38px Orbitron, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // dark outline for legibility over any background
  ctx.strokeStyle = 'rgba(5,8,16,0.9)';
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.strokeText(txt, w / 2, h / 2);
  ctx.fillStyle = color;
  ctx.fillText(txt, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  arcDistanceLabel.material.map.dispose();
  arcDistanceLabel.material.map = tex;
  arcDistanceLabel.material.needsUpdate = true;
}

// ===== Haversine =====
function ellipsoidRadius(lat, eq, polar) {
  const phi = lat * Math.PI / 180;
  const a = eq, b = polar;
  const num = Math.pow(a*a*Math.cos(phi), 2) + Math.pow(b*b*Math.sin(phi), 2);
  const den = Math.pow(a*Math.cos(phi), 2) + Math.pow(b*Math.sin(phi), 2);
  return Math.sqrt(num / den);
}

function haversine(lat1, lon1, lat2, lon2, planet) {
  const R = ellipsoidRadius((lat1 + lat2) / 2, planet.eq, planet.polar);
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// ===== UI =====
const planetListEl = document.getElementById('planet-list');
function renderPlanets() {
  planetListEl.innerHTML = '';
  PLANETS.forEach(p => {
    const isCustom = p.id.startsWith('custom-');
    const typeLabel = p.type === 'gas' ? '气态' : '岩石';
    const card = document.createElement('div');
    card.className = 'planet-card' + (p.id === currentPlanet.id ? ' active' : '');
    card.innerHTML = `
      <div class="planet-dot" style="background:#${p.color.toString(16).padStart(6,'0')};color:#${p.color.toString(16).padStart(6,'0')}"></div>
      <div class="planet-info">
        <div class="planet-name">${p.name}</div>
        <div class="planet-radius">${typeLabel} · EQ ${p.eq}km</div>
      </div>
      ${isCustom ? `<button class="planet-delete" data-id="${p.id}" title="删除星球">×</button>` : ''}`;
    card.onclick = () => selectPlanet(p);
    const delBtn = card.querySelector('.planet-delete');
    if (delBtn) {
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deletePlanet(p.id);
      };
    }
    planetListEl.appendChild(card);
  });
}

function deletePlanet(id) {
  const idx = PLANETS.findIndex(p => p.id === id);
  if (idx === -1) return;
  PLANETS.splice(idx, 1);
  if (currentPlanet.id === id) {
    selectPlanet(PLANETS[0]);
  } else {
    renderPlanets();
  }
}

function selectPlanet(planet) {
  currentPlanet = planet;
  document.getElementById('hud-planet').textContent = planet.en.toUpperCase();
  document.getElementById('planet-label').textContent = planet.en.toUpperCase();
  buildPlanet(planet);
  renderPlanets();
  updatePlanetStats(planet);
  updateScaleBar(planet);
  // re-add markers if coords exist
  const la = parseFloat(document.getElementById('lat-a').value);
  const loa = parseFloat(document.getElementById('lon-a').value);
  const lb = parseFloat(document.getElementById('lat-b').value);
  const lob = parseFloat(document.getElementById('lon-b').value);
  if (!isNaN(la) && !isNaN(loa)) setMarker('A', la, loa);
  if (!isNaN(lb) && !isNaN(lob)) setMarker('B', lb, lob);
  if (!isNaN(la) && !isNaN(loa) && !isNaN(lb) && !isNaN(lob)) drawArc(la, loa, lb, lob);
  updateDistance();
}

function updatePlanetStats(planet) {
  document.getElementById('stat-eq').textContent = planet.eq.toLocaleString('en-US', { maximumFractionDigits: 1 }) + ' km';
  document.getElementById('stat-polar').textContent = planet.polar.toLocaleString('en-US', { maximumFractionDigits: 1 }) + ' km';
  const circumEq = 2 * Math.PI * planet.eq;
  const circumPolar = 2 * Math.PI * planet.polar;
  document.getElementById('stat-circum-eq').textContent = circumEq.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' km';
  document.getElementById('stat-circum-polar').textContent = circumPolar.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' km';
}

function updateScaleBar(planet) {
  const track = document.getElementById('scale-track');
  const label = document.getElementById('scale-label');
  if (!track || !label) return;
  // Map-style scale bar: a line segment representing N km, sized to ~110px.
  // 1 visual unit == planet.eq km; sphere visual radius == BASE_RADIUS (1).
  const distance = camera.position.length();
  const vFov = camera.fov * Math.PI / 180;
  const viewHeightVis = 2 * distance * Math.tan(vFov / 2); // visual units at target plane
  const canvasH = renderer.domElement.clientHeight || 1;
  const kmPerPixel = (viewHeightVis / canvasH) * planet.eq;

  // Pick a "nice" distance so the bar is 80-150 px wide
  const nice = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000];
  let chosen = nice[0];
  let bestPx = Infinity;
  for (const v of nice) {
    const px = v / kmPerPixel;
    if (px >= 80 && px <= 150) { chosen = v; bestPx = px; break; }
    if (Math.abs(px - 110) < Math.abs(bestPx - 110)) { chosen = v; bestPx = px; }
  }
  const barWidth = Math.max(40, Math.round(chosen / kmPerPixel));
  track.style.width = barWidth + 'px';
  label.textContent = `${chosen.toLocaleString('en-US')} km`;
}

// Mode switch removed — clicking the sphere always selects a point.

// Custom planet
document.getElementById('custom-toggle').onclick = () => {
  document.getElementById('custom-form').classList.toggle('show');
};
document.getElementById('create-custom').onclick = () => {
  const name = document.getElementById('custom-name').value.trim();
  const eq = parseFloat(document.getElementById('custom-eq').value);
  const polar = parseFloat(document.getElementById('custom-polar').value);
  const colorHex = document.getElementById('custom-color').value;
  const type = document.getElementById('custom-type').value;
  if (!name || isNaN(eq) || isNaN(polar) || eq <= 0 || polar <= 0) {
    alert('请填写有效的星球名称和半径');
    return;
  }
  const color = parseInt(colorHex.replace('#', ''), 16);
  const custom = { id: 'custom-' + Date.now(), name, en: name, eq, polar, color, type };
  PLANETS.push(custom);
  renderPlanets();
  selectPlanet(custom);
  document.getElementById('custom-form').classList.remove('show');
  // reset form
  document.getElementById('custom-name').value = '';
  document.getElementById('custom-eq').value = '';
  document.getElementById('custom-polar').value = '';
};

// Auto-calculate distance (no button needed)
function updateDistance() {
  const la = parseFloat(document.getElementById('lat-a').value);
  const loa = parseFloat(document.getElementById('lon-a').value);
  const lb = parseFloat(document.getElementById('lat-b').value);
  const lob = parseFloat(document.getElementById('lon-b').value);
  const el = document.getElementById('distance-value');
  const cmp = document.getElementById('distance-compare');
  if ([la, loa, lb, lob].some(v => isNaN(v))) {
    el.textContent = '--';
    cmp.textContent = '';
    return;
  }
  setMarker('A', la, loa);
  setMarker('B', lb, lob);
  drawArc(la, loa, lb, lob);
  const d = haversine(la, loa, lb, lob, currentPlanet);
  el.textContent = d.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const circumference = 2 * Math.PI * (currentPlanet.eq + currentPlanet.polar) / 2;
  const laps = (d / circumference).toFixed(3);
  cmp.textContent = `≈ 绕${currentPlanet.name} ${laps} 圈`;
  if (arcDistanceLabel) updateArcDistanceLabel(d);
}

// Input sync to markers + auto calc
['lat-a','lon-a','lat-b','lon-b'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const la = parseFloat(document.getElementById('lat-a').value);
    const loa = parseFloat(document.getElementById('lon-a').value);
    const lb = parseFloat(document.getElementById('lat-b').value);
    const lob = parseFloat(document.getElementById('lon-b').value);
    if (!isNaN(la) && !isNaN(loa)) {
      setMarker('A', la, loa);
      document.getElementById('latlon-a').textContent = `${la.toFixed(2)}, ${loa.toFixed(2)}`;
    }
    if (!isNaN(lb) && !isNaN(lob)) {
      setMarker('B', lb, lob);
      document.getElementById('latlon-b').textContent = `${lb.toFixed(2)}, ${lob.toFixed(2)}`;
    }
    updateDistance();
  });
});

// ===== Click to select point + drag marker =====
// Strategy:
//  - Point selection is decided in `pointerup`: if the pointer barely moved
//    since `pointerdown` it counts as a tap → place a point. This avoids the
//    native `click` event which can be suppressed by OrbitControls' pointer
//    capture on the second press.
//  - Marker dragging uses pointer events in the CAPTURE phase. When the press
//    lands on a marker we stopPropagation so OrbitControls never sees it (no
//    setPointerCapture, no rotation).
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pointerDownPos = null;
let draggingMarker = null; // 'A' | 'B' | null
let hoveringMarker = false;

function raycastPlanetFromEvent(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return null;
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(planetMesh);
  if (hits.length === 0) return null;
  const localPoint = planetGroup.worldToLocal(hits[0].point.clone());
  const unscaled = localPoint.clone();
  unscaled.y /= (currentPlanet.polar / currentPlanet.eq);
  return vec3ToLatLon(unscaled, currentPlanet.eq, currentPlanet.polar);
}

function findMarkerUnderPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const candidates = [];
  if (markerA) candidates.push(markerA);
  if (markerB) candidates.push(markerB);
  if (candidates.length === 0) return null;
  const hits = raycaster.intersectObjects(candidates, true);
  if (hits.length === 0) return null;
  // traverse up to find the top-level marker
  let obj = hits[0].object;
  while (obj && obj.parent !== planetGroup) obj = obj.parent;
  if (obj === markerA) return 'A';
  if (obj === markerB) return 'B';
  return null;
}

function applyMarkerCoord(point, lat, lon) {
  const latId = point === 'A' ? 'lat-a' : 'lat-b';
  const lonId = point === 'A' ? 'lon-a' : 'lon-b';
  const lblId = point === 'A' ? 'latlon-a' : 'latlon-b';
  document.getElementById(latId).value = lat.toFixed(4);
  document.getElementById(lonId).value = lon.toFixed(4);
  setMarker(point, lat, lon);
  document.getElementById(lblId).textContent = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
}

function selectPointAtEvent(e) {
  if (!planetMesh) return;
  const coord = raycastPlanetFromEvent(e);
  if (!coord) return;
  const { lat, lon } = coord;
  if (nextPoint === 'A') {
    applyMarkerCoord('A', lat, lon);
    nextPoint = 'B';
  } else {
    applyMarkerCoord('B', lat, lon);
    nextPoint = 'A';
  }
  updateDistance();
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
  const hit = findMarkerUnderPointer(e);
  if (hit) {
    e.stopPropagation(); // keep OrbitControls out of this interaction entirely
    draggingMarker = hit;
    controls.enabled = false;
  }
}, true);

window.addEventListener('pointermove', (e) => {
  if (draggingMarker) {
    const coord = raycastPlanetFromEvent(e);
    if (coord) {
      applyMarkerCoord(draggingMarker, coord.lat, coord.lon);
      updateDistance();
    }
    return;
  }
  // Hover detection: pause auto-rotation and show grab cursor over a marker
  const hit = findMarkerUnderPointer(e);
  hoveringMarker = !!hit;
  renderer.domElement.style.cursor = hit ? 'grab' : '';
}, true);

window.addEventListener('pointerup', (e) => {
  if (draggingMarker) {
    e.stopPropagation();
    draggingMarker = null;
    controls.enabled = true;
    pointerDownPos = null;
    return;
  }
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const moved = Math.sqrt(dx * dx + dy * dy);
  pointerDownPos = null;
  if (moved > 5) return; // it was a drag-rotate, not a tap
  selectPointAtEvent(e);
}, true);

// ===== Animation =====
function animate() {
  requestAnimationFrame(animate);
  if (controls.enabled) controls.update();
  // Pause auto-rotation while dragging or hovering a marker so it doesn't drift away
  if (!draggingMarker && !hoveringMarker) planetGroup.rotation.y += 0.0015;
  // Clouds drift slightly faster than the surface for a living-globe feel
  if (planetMesh && planetMesh.userData.clouds) {
    planetMesh.userData.clouds.rotation.y += 0.0004;
  }
  if (markerA && markerA.userData.ring) markerA.userData.ring.lookAt(camera.position);
  if (markerB && markerB.userData.ring) markerB.userData.ring.lookAt(camera.position);
  stars.rotation.y += 0.0001;
  updateScaleBar(currentPlanet);
  renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Init
renderPlanets();
buildPlanet(currentPlanet);
updatePlanetStats(currentPlanet);
updateScaleBar(currentPlanet);
animate();
</script>
